# Set "Base directory" to nexbus-backend in the Netlify site settings
[build]
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

# Every URL (/buses, /auth/login, /api/trips, ...) is handled by the Express app
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
